[project]
name = "emotion-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naresh", email = "reshs92.09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "typer>=0.29.2",
]

[project.scripts]
emotion-classifier = "emotion_classifier:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
